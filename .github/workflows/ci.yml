name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um push novo cancela o anterior no mesmo ref: o E2E sobe Docker, não vale
# pagar por duas execuções da mesma branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Job 1 · Rápido e sem Docker: se lint, tipo, regra fiscal ou build
  # quebraram, o Mateus fica sabendo em ~1 min, sem esperar o E2E.
  # ────────────────────────────────────────────────────────────────────
  quality:
    name: lint · tipos · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `typecheck` roda `next typegen` antes do tsc: os tipos gerados de rota
      # (LayoutProps e cia.) vivem em .next/types e não existem em checkout
      # limpo. Sem isso o comando só passava em máquina com .next quente — foi
      # o primeiro bug que este CI pegou.
      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários (regras fiscais)
        run: npm run test

      # Build sem Docker: as NEXT_PUBLIC_* do stack local são públicas e
      # determinísticas, e nenhuma página chama o Supabase na prerenderização.
      # O que não pode acontecer é o bundle sair com a URL do projeto REMOTO.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
        run: npm run build

  # ────────────────────────────────────────────────────────────────────
  # Job 2 · O fluxo inteiro contra Postgres de verdade: login no GoTrue,
  # RLS ligada, upload no bucket. Nenhum segredo de produção entra aqui —
  # o stack é local e efêmero, criado do zero pelas migrations + seed.
  # ────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E contra o Supabase local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O stack local puxa ~10 imagens do ECR Public da AWS a cada run, e o
      # ECR Public tem rate limit por IP compartilhado entre TODOS os runners
      # do GitHub Actions — não é bug nosso, mas já derrubou 3 runs em 1
      # semana (080/081/082: "toomanyrequests: Data limit exceeded"). A chave
      # leva a versão da CLI (via package-lock.json): quando ela muda, as tags
      # de imagem pinadas também mudam, e o cache velho vira miss de propósito.
      - name: Cache das imagens Docker do Supabase
        id: cache-docker-supabase
        uses: actions/cache@v4
        with:
          path: /tmp/supabase-images.tar
          key: supabase-docker-images-${{ hashFiles('package-lock.json') }}

      - name: Carrega as imagens do cache
        if: steps.cache-docker-supabase.outputs.cache-hit == 'true'
        run: docker load -i /tmp/supabase-images.tar

      # A CLI do Supabase é devDependency (correção do Gate 2): usar `npx`
      # garante no CI a MESMA versão que roda na máquina do Mateus. Instalar a
      # CLI por action separada reabriria o "passa aqui, quebra lá".
      #
      # Com cache quente o `docker compose` não repuxa imagem já presente, e
      # o pull nem chega a acontecer. Em cache frio (1ª vez, ou versão nova da
      # CLI) ainda dependemos do ECR Public — o retry com backoff aqui é
      # para esse caso: o limite é por janela, então esperar e tentar de novo
      # geralmente passa, mesmo quando a 1ª tentativa não passa.
      - name: Sobe o Supabase local
        run: |
          set -uo pipefail
          for tentativa in 1 2 3 4 5; do
            if npx supabase start; then
              exit 0
            fi
            echo "Tentativa $tentativa falhou (provável rate limit do ECR Public) — aguardando antes de tentar de novo"
            npx supabase stop || true
            sleep $((tentativa * 20))
          done
          echo "::error::npx supabase start falhou após 5 tentativas"
          exit 1

      - name: Salva as imagens no cache (só em cache frio)
        if: steps.cache-docker-supabase.outputs.cache-hit != 'true'
        run: docker save -o /tmp/supabase-images.tar $(docker images --format '{{.Repository}}:{{.Tag}}' | grep -v '<none>')

      # e2e/ambiente.ts versiona URL e anon key do stack local de propósito:
      # são públicas e determinísticas. Se uma CLI nova mudar isso, é melhor
      # falhar aqui, dizendo o motivo, do que ver 10 testes vermelhos sem pista.
      - name: Confere as credenciais locais versionadas
        run: |
          set -euo pipefail
          STATUS=$(npx supabase status -o json 2>/dev/null)
          API_URL=$(echo "$STATUS" | jq -r '.API_URL')
          KEY=$(echo "$STATUS" | jq -r '.PUBLISHABLE_KEY')
          if ! grep -q "$API_URL" e2e/ambiente.ts; then
            echo "::error file=e2e/ambiente.ts::URL do stack local mudou para $API_URL"
            exit 1
          fi
          if ! grep -q "$KEY" e2e/ambiente.ts; then
            echo "::error file=e2e/ambiente.ts::anon key do stack local mudou — atualize a constante"
            exit 1
          fi

      # WebKit, não Chromium: o config usa devices["iPhone SE"], cujo
      # defaultBrowserType é webkit. É o motor do alvo real do produto —
      # celular no canteiro, 375px.
      # ~29s por rodada sem cache (medido no run 32640902865). A chave leva a
      # versão do Playwright: browser velho com CLI nova é falha silenciosa.
      - name: Cache do WebKit
        id: cache-webkit
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # --with-deps chama apt por baixo (dependências de sistema do WebKit, não
      # cacheadas por `Cache do WebKit` acima, que só cobre ~/.cache/ms-playwright).
      # No run 36885310685 isso levou 15min contra ~1min do padrão — congestionamento
      # do runner compartilhado, mesma classe de problema do pull do ECR, resolvida
      # do mesmo jeito: retry com backoff em vez de deixar a run inteira cair por isso.
      - name: Instala o WebKit do Playwright
        run: |
          set -uo pipefail
          for tentativa in 1 2 3; do
            if npx playwright install --with-deps webkit; then
              exit 0
            fi
            echo "Tentativa $tentativa falhou — aguardando antes de tentar de novo"
            sleep $((tentativa * 20))
          done
          echo "::error::playwright install --with-deps webkit falhou após 3 tentativas"
          exit 1

      # O globalSetup dá `supabase db reset` (migrations + seed) e o webServer
      # sobe o Next apontado para o stack local — nada a preparar aqui.
      - name: E2E
        run: npm run test:e2e

      - name: Guarda o relatório quando quebra
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Derruba o Supabase local
        if: always()
        run: npx supabase stop
