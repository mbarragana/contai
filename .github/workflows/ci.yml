name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um push novo cancela o anterior no mesmo ref: o E2E sobe Docker, não vale
# pagar por duas execuções da mesma branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Job 1 · Rápido e sem Docker: se lint, tipo, regra fiscal ou build
  # quebraram, o Mateus fica sabendo em ~1 min, sem esperar o E2E.
  # ────────────────────────────────────────────────────────────────────
  quality:
    name: lint · tipos · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários (regras fiscais)
        run: npm run test

      # Build sem Docker: as NEXT_PUBLIC_* do stack local são públicas e
      # determinísticas, e nenhuma página chama o Supabase na prerenderização.
      # O que não pode acontecer é o bundle sair com a URL do projeto REMOTO.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
        run: npm run build

  # ────────────────────────────────────────────────────────────────────
  # Job 2 · O fluxo inteiro contra Postgres de verdade: login no GoTrue,
  # RLS ligada, upload no bucket. Nenhum segredo de produção entra aqui —
  # o stack é local e efêmero, criado do zero pelas migrations + seed.
  # ────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E contra o Supabase local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A CLI do Supabase é devDependency (correção do Gate 2): usar `npx`
      # garante no CI a MESMA versão que roda na máquina do Mateus. Instalar a
      # CLI por action separada reabriria o "passa aqui, quebra lá".
      - name: Sobe o Supabase local
        run: npx supabase start

      # e2e/ambiente.ts versiona URL e anon key do stack local de propósito:
      # são públicas e determinísticas. Se uma CLI nova mudar isso, é melhor
      # falhar aqui, dizendo o motivo, do que ver 10 testes vermelhos sem pista.
      - name: Confere as credenciais locais versionadas
        run: |
          set -euo pipefail
          STATUS=$(npx supabase status -o json 2>/dev/null)
          API_URL=$(echo "$STATUS" | jq -r '.API_URL')
          KEY=$(echo "$STATUS" | jq -r '.PUBLISHABLE_KEY')
          if ! grep -q "$API_URL" e2e/ambiente.ts; then
            echo "::error file=e2e/ambiente.ts::URL do stack local mudou para $API_URL"
            exit 1
          fi
          if ! grep -q "$KEY" e2e/ambiente.ts; then
            echo "::error file=e2e/ambiente.ts::anon key do stack local mudou — atualize a constante"
            exit 1
          fi

      # WebKit, não Chromium: o config usa devices["iPhone SE"], cujo
      # defaultBrowserType é webkit. É o motor do alvo real do produto —
      # celular no canteiro, 375px.
      - name: Instala o WebKit do Playwright
        run: npx playwright install --with-deps webkit

      # O globalSetup dá `supabase db reset` (migrations + seed) e o webServer
      # sobe o Next apontado para o stack local — nada a preparar aqui.
      - name: E2E
        run: npm run test:e2e

      - name: Guarda o relatório quando quebra
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Derruba o Supabase local
        if: always()
        run: npx supabase stop
